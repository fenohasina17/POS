x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  # --- Génération automatique des certificats SSL (mkcert) ---
  cert-init:
    image: alpine:3.19
    restart: "no"
    environment:
      - SERVER_IP=${SERVER_IP:-localhost}
    volumes:
      - ssl_certs:/certs
    entrypoint: >
      sh -c "
        set -e;
        if [ -f /certs/cert.pem ] && [ -f /certs/key.pem ]; then
          echo '✅ Certificats SSL déjà présents — aucune action.';
          exit 0;
        fi;
        echo '🔐 Génération des certificats SSL avec mkcert...';
        apk add --no-cache curl ca-certificates > /dev/null 2>&1;
        ARCH=$$(uname -m);
        case $$ARCH in
          x86_64)  MKCERT_ARCH='linux-amd64' ;;
          aarch64) MKCERT_ARCH='linux-arm64' ;;
          armv7l)  MKCERT_ARCH='linux-arm'   ;;
          *) echo \"Architecture non supportée: $$ARCH\"; exit 1 ;;
        esac;
        curl -fsSL https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-$${MKCERT_ARCH} \
          -o /usr/local/bin/mkcert && chmod +x /usr/local/bin/mkcert;
        mkdir -p /certs/ca;
        CAROOT=/certs/ca mkcert -install 2>/dev/null || true;
        CAROOT=/certs/ca mkcert \
          -cert-file /certs/cert.pem \
          -key-file  /certs/key.pem \
          $${SERVER_IP} localhost 127.0.0.1;
        cp /certs/ca/rootCA.pem /certs/pos-ca.crt;
        chmod 644 /certs/cert.pem /certs/key.pem /certs/pos-ca.crt;
        echo \"✅ Certificats générés pour: $${SERVER_IP}\";
      "

  # --- Base de Données (Postgres) ---
  db:
    image: postgres:15
    restart: always
    logging: *default-logging
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pos_user} -d ${DB_DATABASE:-pos_system}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Cache Redis ---
  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    volumes:
      - redis_data:/data
    networks:
      - pos_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Backend Laravel (PHP-FPM) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - storage_data:/var/www/storage
    networks:
      - pos_network

  # --- Serveur WebSocket (Laravel Reverb) ---
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:8080"
    networks:
      - pos_network

  # --- Serveur Web (Nginx + HTTPS) ---
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    ports:
      - "8000:80"    # HTTP (+ endpoint /ca.crt pour télécharger la CA)
      - "8443:443"   # HTTPS (API)
    environment:
      - SERVER_IP=${SERVER_IP:-localhost}
    depends_on:
      - backend
      cert-init:
        condition: service_completed_successfully
    volumes:
      - storage_data:/var/www/storage
      - ssl_certs:/etc/nginx/ssl:ro
    networks:
      - pos_network

  # --- Frontend (Vue.js + HTTPS) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${REVERB_HOST}
        VITE_REVERB_PORT: ${REVERB_PORT:-8443}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-https}
    restart: always
    logging: *default-logging
    ports:
      - "5173:80"
      - "5443:443"   # HTTPS (Frontend)
    environment:
      - SERVER_IP=${SERVER_IP:-localhost}
    depends_on:
      - nginx
      cert-init:
        condition: service_completed_successfully
    volumes:
      - ssl_certs:/etc/nginx/ssl:ro
    networks:
      - pos_network

  # --- Sauvegarde automatique PostgreSQL ---
  backup:
    image: postgres:15
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=db
    volumes:
      - backup_data:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    entrypoint: >
      sh -c "
        echo '⏰ Sauvegarde planifiée — toutes les 24h à 02h00';
        while true; do
          NEXT=$$(date -d 'tomorrow 02:00' +%s 2>/dev/null || date -v+1d -f '%H:%M' '02:00' +%s 2>/dev/null || echo $$(( $$(date +%s) + 86400 )));
          NOW=$$(date +%s);
          SLEEP=$$((NEXT - NOW));
          echo \"Prochaine sauvegarde dans $${SLEEP}s ($$(date -d \"@$$NEXT\" 2>/dev/null || date -r $$NEXT))\";
          sleep $$SLEEP;
          sh /backup.sh;
        done
      "
    networks:
      - pos_network

  # --- Monitoring (Uptime Kuma) ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    pull_policy: if_not_present
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - pos_network

  # --- Jenkins (CI/CD Automation) ---
  jenkins:
    build:
      context: ./docker/jenkins
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    privileged: true
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pos_network

networks:
  pos_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  jenkins_data:
  storage_data:
  backup_data:
  ssl_certs:
  uptime_kuma_data:
