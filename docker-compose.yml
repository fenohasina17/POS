x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: always
  logging: *default-logging
  env_file: .env
  volumes:
    - storage_data:/var/www/storage
  networks:
    - pos_network
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # --- Base de Données (Postgres) ---
  db:
    image: postgres:15
    restart: always
    logging: *default-logging
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pos_user} -d ${DB_DATABASE:-pos_system}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Cache Redis ---
  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --bind 0.0.0.0;
      else
        redis-server --bind 0.0.0.0;
      fi'
    env_file: .env
    volumes:
      - redis_data:/data
    networks:
      - pos_network
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping;
        else
          redis-cli ping;
        fi'
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Backend Laravel (PHP-FPM) ---
  backend:
    <<: *backend-base
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Serveur WebSocket (Laravel Reverb) ---
  reverb:
    <<: *backend-base
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  # --- Queue Worker (jobs asynchrones + sync agent) ---
  worker:
    <<: *backend-base
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  # --- Scheduler Laravel (tâches planifiées) ---
  scheduler:
    <<: *backend-base
    command: ["php", "artisan", "schedule:work"]

  # --- Serveur Web (Nginx HTTP) ---
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/storage
    networks:
      - pos_network

  # --- Frontend (Vue.js) ---
  # Les URLs sont injectées à l'exécution via env-config.js (pas au build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    ports:
      - "5173:80"
    environment:
      - API_URL=${VITE_API_URL:-http://localhost:8000}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_HOST=${REVERB_HOST:-localhost}
      - REVERB_PORT=${REVERB_PORT:-8000}
      - REVERB_SCHEME=${REVERB_SCHEME:-ws}
    depends_on:
      - nginx
    networks:
      - pos_network

  # --- Sauvegarde automatique PostgreSQL ---
  backup:
    image: postgres:15
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=db
    volumes:
      - backup_data:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    entrypoint: >
      sh -c "
        echo 'Sauvegarde planifiée — toutes les 24h à 02h00';
        while true; do
          NEXT=$$(date -d 'tomorrow 02:00' +%s 2>/dev/null || date -v+1d -f '%H:%M' '02:00' +%s 2>/dev/null || echo $$(( $$(date +%s) + 86400 )));
          NOW=$$(date +%s);
          SLEEP=$$((NEXT - NOW));
          echo \"Prochaine sauvegarde dans $${SLEEP}s\";
          sleep $$SLEEP;
          sh /backup.sh;
        done
      "
    networks:
      - pos_network

  # --- Monitoring local (Uptime Kuma) ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    pull_policy: if_not_present
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - pos_network

networks:
  pos_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
  backup_data:
  uptime_kuma_data:
