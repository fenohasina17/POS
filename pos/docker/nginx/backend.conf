# HTTP (API Backend Laravel)
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    server_tokens off;

    # Résolveur DNS Docker (127.0.0.11) avec TTL court : sans ça, nginx résout
    # backend/reverb une seule fois au démarrage et garde cette IP en mémoire
    # indéfiniment. Une mise à jour qui recrée le backend (nouvelle image)
    # sans recréer nginx laisse alors nginx pointer vers un conteneur qui
    # n'existe plus → 502 sur toute l'API. fastcgi_pass/proxy_pass utilisent
    # donc des variables (seule façon de forcer une résolution dynamique) au
    # lieu d'un nom d'hôte en dur.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy WebSocket Reverb : ws://HOST:8000/app/... → ws://reverb:8080
    location /app/ {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
